name: Dependabot Digest

# Surfaces the fleet-wide Dependabot queue as a single issue, rewritten in
# place on each run.
#
# It exists because the PRs that need a human are exactly the ones that
# generate no notification. Auto-merge handles patches and minors silently;
# majors and grouped updates are declined by policy and then sit unseen. Twenty
# had accumulated across nine repos, the oldest twelve days old, before anyone
# looked (dev-env#120).
#
# The digest only reports. It never merges: merges require a human-created
# merge-lock, which is the deliberate design (Protocol 6) and not something a
# scheduled job should route around.

on:
  schedule:
    # 14:00 UTC daily — morning in US Pacific, so the queue is current when
    # the day starts.
    - cron: '0 14 * * *'
  # A scheduled workflow runs only on the default branch, so a pull request
  # cannot exercise it. This is how the first run gets triggered and how the
  # job is tested after a change.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Two runs writing the same issue would race. Never cancel in progress: a
  # half-written digest is worse than a late one.
  group: dependabot-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Writes the digest issue in this repository. The PR data itself is read
      # with the per-owner app tokens, which carry no write access anywhere.
      issues: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint a token for smartwatermelon
        id: token-smartwatermelon
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.DIGEST_APP_CLIENT_ID }}
          private-key: ${{ secrets.DIGEST_APP_PRIVATE_KEY }}
          owner: smartwatermelon # zizmor: ignore[github-app] whole-fleet survey; no repo subset exists
          permission-checks: read
          permission-contents: read
          permission-pull-requests: read
          permission-statuses: read
          # Reads CodeQL default setup (dev-env#166), the Dependabot alerts setting,
          # and the security-updates setting (dev-env#228).
          permission-administration: read

      - name: Mint a token for nightowlstudiollc
        id: token-nightowlstudiollc
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.DIGEST_APP_CLIENT_ID }}
          private-key: ${{ secrets.DIGEST_APP_PRIVATE_KEY }}
          owner: nightowlstudiollc # zizmor: ignore[github-app] whole-fleet survey; no repo subset exists
          permission-checks: read
          permission-contents: read
          permission-pull-requests: read
          permission-statuses: read
          # Reads CodeQL default setup (dev-env#166), the Dependabot alerts setting,
          # and the security-updates setting (dev-env#228).
          permission-administration: read

      - name: Mint a token for twistedmelonman
        id: token-twistedmelonman
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.DIGEST_APP_CLIENT_ID }}
          private-key: ${{ secrets.DIGEST_APP_PRIVATE_KEY }}
          owner: twistedmelonman # zizmor: ignore[github-app] whole-fleet survey; no repo subset exists
          permission-checks: read
          permission-contents: read
          permission-pull-requests: read
          permission-statuses: read
          # Reads CodeQL default setup (dev-env#166), the Dependabot alerts setting,
          # and the security-updates setting (dev-env#228).
          permission-administration: read

      - name: Build and publish the digest
        env:
          # Per-owner app tokens minted above. Why an app, not PATs:
          # docs/runbooks/dependabot-digest-credentials.md
          DIGEST_TOKEN_SMARTWATERMELON: ${{ steps.token-smartwatermelon.outputs.token }}
          DIGEST_TOKEN_NIGHTOWLSTUDIOLLC: ${{ steps.token-nightowlstudiollc.outputs.token }}
          DIGEST_TOKEN_TWISTEDMELONMAN: ${{ steps.token-twistedmelonman.outputs.token }}
          # A token that has lost private-repo access still answers searches
          # successfully, returning only public results. Naming one private
          # repo per owner lets the collector prove it can still see private
          # repositories, so an incomplete digest fails loudly rather than
          # reporting an empty queue.
          #
          # Each probe must stay private; a public one proves nothing. An owner
          # without a probe is silently exempt.
          DIGEST_PROBE_SMARTWATERMELON: smartwatermelon/claude-config-backup
          DIGEST_PROBE_NIGHTOWLSTUDIOLLC: nightowlstudiollc/kebab-tax
          DIGEST_PROBE_TWISTEDMELONMAN: twistedmelonman/ralph-burndown
          # Used only to write the issue in this repository.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # dev-env#228: PRs the auto-merge gate did not merge are pushed here,
          # the same topic the site monitor uses. Empty with such PRs fails the run.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/dependabot-digest/run-digest.sh --run-url "${RUN_URL}"
